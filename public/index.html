<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fahrtenbuch</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fahrtenbuch">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #000;
    --bg: #fff;
    --gray: #a3a9b0;
    --gray-2: #c4c9cf;
    --gray-3: #d9dde1;
    --soft: #f4f5f7;
    --line: #eef0f2;
    --red: #e0312f;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --pad: 28px;
    --ease: cubic-bezier(.32,.72,0,1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", system-ui, sans-serif;
  }

  html { background: var(--bg); -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  #h-body, #h-live { transition: opacity .25s ease; }
  body.booting #h-body, body.booting #h-live { opacity: 0; }
  #h-body { touch-action: pan-y; will-change: transform; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased; min-height: 100vh; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  input { -webkit-user-select: text; user-select: text; }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  .app { max-width: 520px; margin: 0 auto; padding: calc(var(--safe-top) + 18px) var(--pad) calc(var(--safe-bottom) + 110px); }

  /* ── Kopf ───────────────────────────────────────────── */
  .top { display: flex; align-items: center; justify-content: space-between; margin: 0 -10px 48px; }
  .month-nav { display: flex; align-items: center; gap: 2px; font-size: 15px; font-weight: 700; }
  .month-nav #h-month { padding: 0 4px; }
  .mnav, .gear { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--gray); transition: background .15s, opacity .15s; }
  .mnav:active, .gear:active { background: var(--soft); }
  .mnav:disabled { opacity: .25; }
  .mnav svg { width: 16px; height: 16px; }
  .gear svg { width: 19px; height: 19px; }

  /* ── Kennzahl ───────────────────────────────────────── */
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--gray); margin-bottom: 6px; }
  .hero { font-size: 40px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
  .hero small { font-size: 20px; letter-spacing: -0.01em; }
  .delta { margin-top: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .delta svg { width: 12px; height: 12px; }
  .sub { margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--gray); }

  /* ── Laufende Fahrt ─────────────────────────────────── */
  .live {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    margin: -24px 0 40px; padding: 16px 18px; border-radius: 18px; background: var(--ink); color: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,.14); transition: transform .15s var(--ease);
  }
  .live:active { transform: scale(.98); }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff; flex: 0 0 auto; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .live .main { flex: 1; min-width: 0; }
  .live .t { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live .s { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.6); margin-top: 3px; }
  .live svg { width: 16px; height: 16px; opacity: .6; flex: 0 0 auto; }

  /* ── Diagramm ───────────────────────────────────────── */
  .chart { margin: 36px 0 4px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font); font-size: 9px; fill: var(--gray); font-weight: 600; }
  .chart .lbl-strong { fill: var(--ink); }
  /* Linie zeichnet sich beim Öffnen, Monatswechsel und nach dem Speichern */
  .chart.draw .line { stroke-dasharray: 1; animation: drawLine .7s cubic-bezier(.33,0,.15,1) both; }
  .chart.draw .end { transform-box: fill-box; transform-origin: center; animation: popIn .32s cubic-bezier(.23,1,.32,1) .6s both; }
  .chart.draw .lbl-strong { animation: fadeIn .25s ease .65s both; }
  @keyframes drawLine { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.4); } }

  /* ── Listen ─────────────────────────────────────────── */
  .section { margin-top: 28px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--gray); margin-bottom: 4px; }
  .section-head .aside { font-size: 13px; color: var(--gray); font-weight: 600; margin: -10px -10px -10px 0; padding: 10px; }
  .section-head .aside:active { opacity: .5; }

  .row {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 0; text-align: left;
    transition: opacity .15s;
  }
  .row:active { opacity: .5; }
  .ic {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--soft);
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .ic svg { width: 16px; height: 16px; }
  .ic.dark { background: var(--ink); color: #fff; }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .s { font-size: 12px; font-weight: 500; color: var(--gray); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .r { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .row .chev { color: var(--gray-2); width: 16px; height: 16px; flex: 0 0 auto; }

  .empty { padding: 36px 0; color: var(--gray); font-size: 13px; font-weight: 500; line-height: 1.5; }
  .empty b { display: block; color: var(--ink); font-size: 14px; }

  /* ── Untere Leiste ──────────────────────────────────── */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 24px var(--pad) calc(var(--safe-bottom) + 16px);
    background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 34%);
    pointer-events: none;
  }
  .dock-inner { max-width: 472px; margin: 0 auto; display: flex; gap: 10px; }
  .dock .sq { pointer-events: auto; }
  .pill {
    pointer-events: auto; flex: 1; height: 52px; border-radius: 16px; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    font-size: 15px; font-weight: 700; white-space: nowrap; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.16);
    transition: transform .15s var(--ease), opacity .2s;
  }
  .pill:active { transform: scale(.97); }
  .pill svg { width: 18px; height: 18px; }
  .pill:disabled { opacity: .25; box-shadow: none; }

  /* ── Sheet ──────────────────────────────────────────── */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 40; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; top: 0; height: 100vh; z-index: 50;
    display: flex; justify-content: center; pointer-events: none;
  }
  .sheet-card {
    pointer-events: auto; width: 100%; max-width: 520px; margin-top: calc(var(--safe-top) + 10px);
    background: #fff; border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
    transform: translateY(105%); transition: transform .42s var(--ease); box-shadow: 0 -10px 40px rgba(0,0,0,.08);
    overflow: hidden;
  }
  .sheet:not(.open) .sheet-card { visibility: hidden; transition: transform .42s var(--ease), visibility 0s .42s; }
  .sheet.open .sheet-card { transform: none; }
  .sheet.dragging .sheet-card { transition: none; }
  .grab { flex: 0 0 auto; padding: 10px 0 8px; display: flex; justify-content: center; cursor: grab; }
  .grab i { width: 34px; height: 4px; border-radius: 4px; background: var(--gray-3); }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 22px var(--pad) 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; will-change: transform; }
  .screen.in-fwd { animation: inFwd .28s var(--ease); }
  .screen.in-back { animation: inBack .28s var(--ease); }
  @keyframes inFwd { from { opacity: 0; transform: translateX(24px); } }
  @keyframes inBack { from { opacity: 0; transform: translateX(-24px); } }
  .s-label { font-size: 12px; font-weight: 600; color: var(--gray); }
  .s-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 10px; }

  .display { flex: 1; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .display .val { position: relative; perspective: 300px; font-size: 42px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
  .display .val .ghost { color: var(--gray-3); }
  .display .val span { display: inline-block; transition: color .15s ease; }
  .display .val .gone { position: absolute; pointer-events: none; }
  .display .val .slot { color: var(--gray-3); }
  .display .val.empty-val { color: var(--gray-3); }
  .display .hint { font-size: 13px; font-weight: 600; color: var(--gray); text-align: center; min-height: 18px; }
  .display .hint.ok { color: var(--ink); }
  .display .hint.warn { color: var(--red); }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0 8px 4px; }
  .key { height: 58px; font-size: 24px; font-weight: 600; display: grid; place-items: center; border-radius: 14px; transition: background .12s; }
  .key:active { background: var(--soft); }
  .key svg { width: 22px; height: 22px; }

  .sheet-foot { flex: 0 0 auto; display: flex; gap: 10px; align-items: center; padding: 12px var(--pad) calc(var(--safe-bottom) + 16px); }
  .sq {
    width: 52px; height: 52px; border-radius: 16px; background: #fff; flex: 0 0 auto;
    box-shadow: 0 4px 16px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.03); display: grid; place-items: center;
  }
  .sq svg { width: 16px; height: 16px; }
  .sq:active { background: var(--soft); }
  .sheet-foot .pill { flex: 0 1 200px; margin-left: auto; box-shadow: 0 8px 24px rgba(0,0,0,.14); }

  .text-in {
    width: 100%; border: 0; outline: none; background: var(--soft); font-size: 17px; font-weight: 600;
    margin-top: 28px; padding: 15px 16px; border-radius: 14px; caret-color: var(--ink); -webkit-appearance: none; appearance: none;
  }
  .text-in::placeholder { color: var(--gray); font-weight: 500; }
  .suggest { margin-top: 14px; padding-bottom: 12px; }
  .rcpts { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  .rcpt { position: relative; }
  .rcpt .text-in { margin-top: 0; padding-right: 52px; }
  .rcpt .rm { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center; color: var(--gray); border-radius: 10px; }
  .rcpt .rm svg { width: 16px; height: 16px; }
  .rcpt .rm:active { background: var(--line); }
  .add-rcpt { margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; padding: 8px 0; }
  .add-rcpt svg { width: 18px; height: 18px; }
  .add-rcpt:active { opacity: .5; }

  .summary { margin-top: 28px; }
  .sum-row {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    width: 100%; padding: 12px 0; font-size: 14px; text-align: left;
  }
  .sum-row .k { color: var(--gray); font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .sum-row .k svg { width: 13px; height: 13px; color: var(--gray-2); }
  .sum-row .v { font-weight: 700; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sum-row .v.warn { color: var(--red); }
  button.sum-row:active { opacity: .5; }
  .sum-row input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; -webkit-appearance: none; appearance: none; }
  .fine { margin-top: 24px; font-size: 12px; color: var(--gray); font-weight: 500; line-height: 1.55; }
  .fine b { color: var(--ink); }
  .del-btn { margin: 24px 0 10px; font-size: 14px; font-weight: 700; color: var(--red); display: flex; align-items: center; gap: 12px; }
  .del-btn .ic { background: var(--red); color: #fff; width: 30px; height: 30px; }
  .del-btn .ic svg { width: 14px; height: 14px; }

  /* ── Toast ──────────────────────────────────────────── */
  .toast {
    position: fixed; top: calc(var(--safe-top) + 10px); left: 50%; z-index: 100;
    transform: translate(-50%, -140%); transition: transform .45s var(--ease), visibility 0s .45s; visibility: hidden;
    background: var(--ink); color: #fff; border-radius: 99px; padding: 6px 18px 6px 6px;
    display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: calc(100vw - 32px);
  }
  .toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform .45s var(--ease); }
  .toast .ti { width: 24px; height: 24px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; flex: 0 0 auto; }
  .toast .ti svg { width: 13px; height: 13px; }
  .toast.error .ti { background: var(--red); color: #fff; }
  .toast span { overflow: hidden; text-overflow: ellipsis; }

  /* Bewegung reduzieren: keine Bewegungen, aber weiche Überblendungen, damit nichts aufpoppt */
  @media (prefers-reduced-motion: reduce) {
    .sheet-card, .sheet:not(.open) .sheet-card { transform: none; opacity: 0; transition: opacity .2s ease, visibility 0s .2s; }
    .sheet.open .sheet-card { opacity: 1; transition: opacity .2s ease; }
    .screen.in-fwd, .screen.in-back { animation: fadeIn .2s ease; }
    .toast, .toast.show { transform: translate(-50%, 0); }
    .toast { opacity: 0; transition: opacity .2s ease, visibility 0s .2s; }
    .toast.show { opacity: 1; transition: opacity .2s ease; }
    .pill:active, .live:active { transform: none; }
    .live .dot { animation: none; }
    .chart.draw .line, .chart.draw .end, .chart.draw .lbl-strong { animation: none; }
  }
  @keyframes fadeIn { from { opacity: 0; } }
  @media (min-width: 600px) {
    .sheet-card { margin-top: 40px; margin-bottom: 40px; border-radius: 18px; }
  }
</style>
</head>
<body class="booting">

<div class="app">
  <header class="top">
    <div class="month-nav">
      <button class="mnav" data-action="prev" aria-label="Voriger Monat"><span data-icon="back"></span></button>
      <span id="h-month">&nbsp;</span>
      <button class="mnav" data-action="next" id="btn-next-month" aria-label="Nächster Monat"><span data-icon="next"></span></button>
    </div>
    <button class="gear" data-action="settings" aria-label="Einstellungen"><span data-icon="gear"></span></button>
  </header>

  <div id="h-live"></div>
  <div id="h-body">
  <div class="hero num" id="h-km">&nbsp;</div>
  <div class="delta" id="h-delta">&nbsp;</div>
  <div class="sub" id="h-sub">&nbsp;</div>
  <div class="chart" id="h-chart"></div>

  <div class="section">
    <div class="section-head"><span>Fahrten</span><button class="aside" data-action="all" id="btn-all">Alle</button></div>
    <div id="h-list"></div>
  </div>
  </div>
  <input type="file" id="file-in" accept=".csv,text/csv" multiple hidden>
</div>

<div class="dock">
  <div class="dock-inner">
    <button class="sq" data-action="export" aria-label="Exportieren"><span data-icon="share"></span></button>
    <button class="pill" id="dock-main" data-action="primary"><span>Fahrt starten</span><span data-icon="plus"></span></button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="sheet-card" id="sheet-card">
    <div class="grab" id="grab"><i></i></div>
    <div class="screen" id="screen"></div>
    <div class="sheet-foot" id="sheet-foot">
      <button class="sq" id="btn-back" aria-label="Zurück"></button>
      <button class="pill" id="btn-next"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="ti"></span><span></span></div>

<script>
// ── Icons ────────────────────────────────────────────────────────────────────
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  next: '<path d="M9 6l6 6-6 6"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  bksp: '<path d="M20 12H5M11 6l-6 6 6 6"/>',
  share: '<path d="M12 14V4M8 8l4-4 4 4M6 11H5v9h14v-9h-1"/>',
  road: '<path d="M9 3L5 21M15 3l4 18M12 5v2M12 11v2M12 17v2"/>',
  euro: '<path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h10M4 14h10"/>',
  upload: '<path d="M12 15V4M7 9l5-5 5 5M5 15v4h14v-4"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 15v4h14v-4"/>',
  doc: '<path d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5"/>',
  table: '<path d="M4 5h16v14H4zM4 10h16M4 15h16M10 5v14"/>',
  trash: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  cal: '<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',
  gear: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  alert: '<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/>',
};
function icon(name) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
}

// ── Helfer ───────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('de-DE');
const fmtKm = n => nf.format(Math.round(n));
const fmtEur = n => n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const fmtOdo = s => (s === null || s === undefined || s === '') ? '—' : nf.format(Number(s));
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayIso = () => isoOf(new Date());
const currentYM = () => todayIso().slice(0, 7);
const parseIso = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDateDE = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
const shortDate = iso => parseIso(iso).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
const monthName = ym => { const [y, m] = ym.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }); };
const monthOnly = ym => { const [y, m] = ym.split('-'); return new Date(y, m - 1, 1).toLocaleDateString('de-DE', { month: 'long' }); };
const monthShort = ym => { const [y, m] = ym.split('-'); const s = new Date(y, m - 1, 1).toLocaleDateString('de-DE', { month: 'short' }).replace('.', ''); return y === currentYM().slice(0, 4) ? s : `${s} ${y.slice(2)}`; };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
function relDate(iso) {
  const t = todayIso();
  if (iso === t) return 'Heute';
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (iso === isoOf(y)) return 'Gestern';
  return parseIso(iso).toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
}
const tripKm = t => Number(t.km) || 0;
const sumKm = list => list.reduce((s, t) => s + tripKm(t), 0);

// ── API ──────────────────────────────────────────────────────────────────────
async function api(method, path, body, raw) {
  try {
    const res = await fetch('/api' + path, {
      method,
      headers: body ? { 'Content-Type': raw ? 'text/csv' : 'application/json' } : {},
      body: body ? (raw ? body : JSON.stringify(body)) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Serverfehler');
    return data;
  } catch (e) {
    toast(e.message === 'Failed to fetch' ? 'Keine Verbindung zum Server' : e.message, true);
    throw e;
  }
}

// ── Zustand ──────────────────────────────────────────────────────────────────
const state = {
  trips: [],
  settings: { freeKm: 300, pricePerKm: 0.22, name: '' },
  open: null,
  month: currentYM(),
  intro: 'all',   // nächstes Rendern mit Einzeichnen ('all' = Diagramm + Liste, 'chart' = nur Diagramm)
};

async function load() {
  const [trips, settings, open, mail, version] = await Promise.all([api('GET', '/trips'), api('GET', '/settings'), api('GET', '/open'),
    api('GET', '/mail').catch(() => null), fetch('/api/version').then(r => r.json()).catch(() => null)]);
  state.version = version;
  state.mail = mail;
  state.trips = trips;
  state.open = open;
  state.settings = { freeKm: 300, pricePerKm: 0.22, name: '', ...settings };
  render();
  document.body.classList.remove('booting');
}

// Letzter bekannter KM-Stand = Endstand der zeitlich letzten Fahrt
// Mit Datum: letzter Endstand bis einschließlich diesem Tag (für nachgetragene Fahrten)
function lastOdo(excludeId, uptoDate) {
  for (let i = state.trips.length - 1; i >= 0; i--) {
    const t = state.trips[i];
    if (uptoDate && t.date > uptoDate) continue;
    if (t.id !== excludeId && t.km_end) return String(t.km_end);
  }
  return '';
}

// Zielvorschläge – werden bei jedem Öffnen aus den gespeicherten Fahrten berechnet.
// Jede Fahrt zählt nach Alter: heute 1, nach 60 Tagen 0,5, nach 120 Tagen 0,25 …
// So wandern Ziele, zu denen du gerade oft fährst, schnell nach oben, alte rutschen nach unten.
const HALF_LIFE_DAYS = 60;
function purposeSuggestions(query) {
  const now = Date.now();
  const groups = new Map();   // Kleinschreibung → { label, score }
  for (const t of state.trips) {
    const label = t.purpose.trim();
    if (!label) continue;
    const key = label.toLowerCase();
    const ageDays = Math.max(0, (now - parseIso(t.date).getTime()) / 864e5);
    const g = groups.get(key) || { label, score: 0 };
    g.score += 0.5 ** (ageDays / HALF_LIFE_DAYS);
    g.label = label;          // jüngste Schreibweise anzeigen (Fahrten sind nach Datum sortiert)
    groups.set(key, g);
  }
  const q = (query || '').trim().toLowerCase();
  return [...groups.entries()]
    .filter(([key]) => !q || (key.includes(q) && key !== q))
    .sort((a, b) => b[1].score - a[1].score)
    .slice(0, 6)
    .map(([, g]) => g.label);
}

function monthStats(ym) {
  const trips = state.trips.filter(t => t.date.startsWith(ym));
  const total = sumKm(trips);
  const extra = Math.max(0, total - state.settings.freeKm);
  return { trips, total, extra, cost: extra * state.settings.pricePerKm };
}

// ── Rendering ────────────────────────────────────────────────────────────────
function shiftMonth(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}

function render() {
  // Einzeichnen/Einblenden nur bei Start, Monatswechsel und Speichern – nicht bei jedem Neuzeichnen
  const intro = reduceMotion.matches ? null : state.intro;
  state.intro = null;
  $('#dock-main').innerHTML = state.open
    ? `<span>Fahrt beenden</span>${icon('check')}`
    : `<span>Fahrt starten</span>${icon('plus')}`;

  const o = state.open;
  const appeared = o && !$('#h-live .live');
  $('#h-live').innerHTML = o ? `
    <button class="live" data-action="open-trip">
      <span class="dot"></span>
      <span class="main"><div class="t">Unterwegs · ${esc(o.purpose)}</div><div class="s num">${relDate(o.date)} · ab ${fmtOdo(o.km_start)}</div></span>
      ${icon('next')}
    </button>` : '';
  if (appeared && !reduceMotion.matches) $('#h-live .live').animate(
    [{ opacity: 0, transform: 'scale(.96)' }, { opacity: 1, transform: 'none' }],
    { duration: 320, easing: 'cubic-bezier(.23,1,.32,1)' });

  const ym = state.month;
  const isCurrent = ym === currentYM();
  const days = daysIn(ym);
  const { trips, total, extra, cost } = monthStats(ym);
  const free = state.settings.freeKm;

  $('#h-month').textContent = ym.slice(0, 4) === currentYM().slice(0, 4) ? monthOnly(ym) : monthName(ym);
  $('#btn-next-month').disabled = isCurrent;
  $('#h-km').innerHTML = `${fmtKm(total)} <small>km</small>`;

  if (isCurrent) {
    const day = new Date().getDate();
    const diff = free / days * day - total;
    const rest = Math.max(0, free - total);
    $('#h-delta').innerHTML = diff >= 0
      ? `${icon('down')} ${fmtKm(diff)} km unter Tagesbudget`
      : `${icon('up')} ${fmtKm(-diff)} km über Tagesbudget`;
    $('#h-sub').textContent = extra > 0
      ? `${fmtKm(extra)} km über den Freikilometern · ${fmtEur(cost)}`
      : `Noch ${fmtKm(rest)} km frei · ${fmtKm(rest / Math.max(1, days - day + 1))} km pro Tag`;
    $('#h-chart').innerHTML = chartSVG(ym, trips, day);
  } else {
    $('#h-delta').innerHTML = extra > 0
      ? `${icon('up')} ${fmtKm(extra)} km über den Freikilometern`
      : `von ${fmtKm(free)} km frei`;
    $('#h-sub').textContent = `${fmtEur(cost)} zu zahlen`;
    $('#h-chart').innerHTML = chartSVG(ym, trips, days);
  }

  const recent = [...trips].reverse().slice(0, 3);
  $('#btn-all').textContent = trips.length > 3 ? `Alle ${trips.length}` : 'Alle';
  $('#h-chart').classList.toggle('draw', !!intro);
  $('#h-list').innerHTML = recent.length ? recent.map(tripRow).join('')
    : `<div class="empty">${state.trips.length ? 'Keine Fahrten in diesem Monat.' : 'Noch keine Fahrten. Importiere deine CSV-Dateien über das Regler-Symbol oben rechts.'}</div>`;
  if (intro === 'all') stagger($('#h-list'));
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function switchMonth(dir) {
  state.month = shiftMonth(state.month, dir);
  state.intro = 'all';
  render();
  monthSwipe.enter(dir);
}

// Zeilen nacheinander einblenden; ab der 8. kommen alle zusammen, damit lange Listen nicht warten lassen
function stagger(container, base = 160) {
  if (!container || reduceMotion.matches) return;
  container.querySelectorAll('.row').forEach((row, i) => row.animate(
    [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
    { duration: 320, delay: base + Math.min(i, 8) * 45, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'backwards' }));
}

function tripRow(t) {
  return `<button class="row" data-trip="${t.id}">
    <span class="main"><div class="t">${esc(t.purpose)}</div><div class="s">${relDate(t.date)}</div></span>
    <span class="r num">${fmtKm(tripKm(t))} km</span>
  </button>`;
}

// Alle Fahrten des Monats, antippen zum Bearbeiten
function allTripsScreen(ym) {
  return {
    label: 'Fahrten', title: monthName(ym), list: true,
    mount(el) {
      const trips = [...monthStats(ym).trips].reverse();
      el.insertAdjacentHTML('beforeend', `<div class="summary">${trips.length ? trips.map(tripRow).join('') : '<div class="empty">Keine Fahrten in diesem Monat.</div>'}</div>`);
      stagger(el.querySelector('.summary'), 90);
      el.querySelectorAll('[data-trip]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const t = state.trips.find(x => x.id === Number(b.dataset.trip));
        if (t) { setEditDraft(t); push(screenSummary()); }
      }));
    },
    next: { label: 'Nachtragen', icon: 'plus', run: () => { newDraft(); push(screenDate()); } },
  };
}

// Kumulierte Kilometer im Monat vs. Freikilometer-Budget
function chartSVG(ym, trips, uptoDay) {
  const W = 340, H = 124, L = 0, R = 300, T = 12, B = 98;
  const days = daysIn(ym), free = state.settings.freeKm;
  const perDay = new Array(days + 1).fill(0);
  trips.forEach(t => { perDay[Number(t.date.slice(8, 10))] += tripKm(t); });
  const total = sumKm(trips);
  const yMax = Math.max(free, total, 1) * 1.08;
  const x = d => L + (d / days) * (R - L);
  const y = v => B - (v / yMax) * (B - T);

  const pts = [[x(0), y(0)]];
  let cum = 0;
  for (let d = 1; d <= Math.min(uptoDay, days); d++) {
    if (perDay[d]) pts.push([x(d - 1 + 0.5), y(cum)]);
    cum += perDay[d];
    if (perDay[d]) pts.push([x(d - 0.5), y(cum)]);
  }
  if (uptoDay > 0) pts.push([x(Math.min(uptoDay, days)), y(cum)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const end = pts[pts.length - 1];

  const ticks = [1, 8, 15, 22, days].map(d =>
    `<text x="${x(d - 0.5).toFixed(1)}" y="${H - 6}" text-anchor="middle">${d}.</text>`).join('');
  const over = total > free;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilometerverlauf ${monthName(ym)}">
    <line x1="${L}" y1="${y(free)}" x2="${R}" y2="${y(free)}" stroke="#d9dde1" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#eef0f2" stroke-width="1"/>
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(days)}" y2="${y(free)}" stroke="#c4c9cf" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="${W}" y="${y(free) + 3.5}" text-anchor="end">${fmtKm(free)}</text>
    <text x="${W}" y="${B + 3.5}" text-anchor="end">0</text>
    ${uptoDay > 0 ? `
      <path class="line" pathLength="1" d="${path}" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <g class="end">
        <circle cx="${end[0]}" cy="${end[1]}" r="9" fill="#e6e8eb"/>
        <circle cx="${end[0]}" cy="${end[1]}" r="3.5" fill="#000"/>
      </g>
      ${!over && Math.abs(y(free) - end[1]) > 14 && B - end[1] > 14 ? `<text x="${W}" y="${end[1] + 3.5}" text-anchor="end" class="lbl-strong">${fmtKm(total)}</text>` : ''}` : ''}
    ${ticks}
  </svg>`;
}

// ── Navigation ───────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  if (e.target.closest('#sheet')) return;
  const t = e.target.closest('[data-trip]');
  if (t) { const trip = state.trips.find(x => x.id === Number(t.dataset.trip)); if (trip) startEdit(trip); return; }
  const a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  ({
    'primary': () => state.open ? finishTrip() : startTrip(),
    'open-trip': openTripDetails,
    'all': () => openSheet(allTripsScreen(state.month)),
    'export': () => openSheet(exportScreen(state.month)),
    'settings': () => openSheet(settingsScreen()),
    'prev': () => switchMonth(-1),
    'next': () => { if (state.month < currentYM()) switchMonth(1); },
  })[a.dataset.action]?.();
});

// ═════════════════════════════════════════════════════════════════════════════
// Sheet: eine Sache nach der anderen
// ═════════════════════════════════════════════════════════════════════════════
const sheet = { stack: [], keypad: null };

function openSheet(screen) {
  gesture.reset();
  sheet.stack = [screen];
  document.body.classList.add('locked');
  $('#scrim').classList.add('open');
  $('#sheet').classList.add('open');
  fitSheet();
  showScreen(null);
}
function closeSheet() {
  gesture.reset();
  $('#scrim').classList.remove('open');
  $('#sheet').classList.remove('open');
  document.body.classList.remove('locked');
  sheet.stack = []; sheet.keypad = null;
  document.activeElement?.blur?.();
}
function push(screen) { sheet.stack.push(screen); showScreen('fwd'); }
function pop() {
  if (sheet.stack.length <= 1) return closeSheet();
  sheet.stack.pop(); showScreen('back');
}
function current() { return sheet.stack[sheet.stack.length - 1]; }

function showScreen(dir) {
  const scr = current();
  const el = $('#screen');
  sheet.keypad = null;
  el.className = 'screen' + (dir ? ' in-' + dir : '');
  void el.offsetWidth;
  el.innerHTML = `${scr.label ? `<div class="s-label">${esc(scr.label)}</div>` : ''}<div class="s-title" id="s-title"></div>`;
  scr.mount(el);
  el.scrollTop = 0;
  updateFoot();
}

function updateFoot() {
  const scr = current();
  if (!scr) return;
  const title = typeof scr.title === 'function' ? scr.title() : scr.title;
  const tEl = $('#s-title'); if (tEl) tEl.textContent = title;
  $('#btn-back').innerHTML = icon(sheet.stack.length > 1 || scr.list ? 'back' : 'close');
  const next = $('#btn-next');
  if (scr.next) {
    next.style.display = '';
    const label = typeof scr.next.label === 'function' ? scr.next.label() : scr.next.label;
    next.innerHTML = `<span>${esc(label || 'Weiter')}</span>${icon(scr.next.icon || 'next')}`;
    next.disabled = scr.next.enabled ? !scr.next.enabled() : false;
  } else next.style.display = 'none';
}

$('#btn-back').addEventListener('click', pop);
$('#btn-next').addEventListener('click', () => { const s = current(); if (s?.next && !$('#btn-next').disabled) s.next.run(); });
$('#scrim').addEventListener('click', closeSheet);

// Sheet passt sich der sichtbaren Fläche an (iOS-Tastatur)
function fitSheet() {
  const vv = window.visualViewport;
  const s = $('#sheet');
  s.style.height = (vv ? vv.height : window.innerHeight) + 'px';
  s.style.top = (vv ? vv.offsetTop : 0) + 'px';
}
window.visualViewport?.addEventListener('resize', fitSheet);
window.visualViewport?.addEventListener('scroll', fitSheet);
window.addEventListener('resize', fitSheet);

// ── Gesten im Sheet ──────────────────────────────────────────────────────────
// Nach unten wischen (Inhalt ganz oben) → schließen. Vom linken Rand nach rechts → zurück.
// Folgt dem Finger 1:1, entscheidet beim Loslassen über die Geschwindigkeit (Momentum-Projektion
// wie bei iOS) und lässt sich jederzeit wieder greifen.
const SNAP = 'cubic-bezier(.32,.72,0,1)';          // gleiche Kurve wie Öffnen/Schließen
const FLING = 'cubic-bezier(.2,.8,.2,1)';          // Anfangssteigung 4 → passt zur Fingergeschwindigkeit
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rubber = (x, dim, c = 0.55) => (x * dim * c) / (dim + c * Math.abs(x));
const project = (v, d = 0.99) => v * d / (1 - d);  // v in px/ms → Strecke bis zum Stillstand

const gesture = (() => {
  const card = $('#sheet-card'), scrim = $('#scrim'), scr = $('#screen');
  let g = null, timer = null, suppressClick = false;

  const offsetOf = el => { const m = getComputedStyle(el).transform; return m && m !== 'none' ? new DOMMatrix(m) : new DOMMatrix(); };
  const velocity = () => {
    const h = g.hist, last = h[h.length - 1];
    let i = h.length - 1;
    while (i > 0 && last.t - h[i - 1].t < 80) i--;
    const first = h[i], dt = last.t - first.t;
    return dt > 0 ? (last.v - first.v) / dt : 0;
  };
  const reset = () => {
    clearTimeout(timer);
    for (const el of [card, scr, scrim]) { el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }
  };

  function start(x, y, target) {
    if (!sheet.stack.length || g) return;
    clearTimeout(timer);
    // Läuft gerade eine Animation? Dort weitermachen, wo das Sheet gerade ist (unterbrechbar)
    // Nur eigene, noch laufende Gesten-Animationen übernehmen (nicht die Einblend-Animation des Schritts)
    const cardMoving = card.style.transform || card.getAnimations().length;   // auch mitten im Öffnen
    const cardY = cardMoving ? offsetOf(card).m42 : 0;
    const scrX = scr.style.transform ? offsetOf(scr).m41 : 0;
    g = { mode: 'pending', x0: x, y0: y, cardY, scrX, target, hist: [], h: card.offsetHeight, w: card.offsetWidth };
    if (Math.abs(cardY) > 1 || Math.abs(scrX) > 1) {
      card.style.transition = scr.style.transition = scrim.style.transition = 'none';
      card.style.transform = `translateY(${cardY}px)`;
      g.mode = cardY ? 'down' : 'back';
    }
  }

  function move(x, y, e) {
    if (!g) return;
    const dx = x - g.x0, dy = y - g.y0;
    if (g.mode === 'pending') {
      if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      const inScroller = g.target.closest('.screen');
      if (g.x0 < 32 && dx > 0 && Math.abs(dx) > Math.abs(dy) && sheet.stack.length > 1) g.mode = 'back';
      else if (dy > 0 && Math.abs(dy) >= Math.abs(dx) && (!inScroller || scr.scrollTop <= 0)) g.mode = 'down';
      // nach oben: nur Gummiband, wenn es nichts zu scrollen gibt
      else if (dy < 0 && Math.abs(dy) >= Math.abs(dx) && (!inScroller || scr.scrollHeight <= scr.clientHeight)) g.mode = 'down';
      else { g = null; return; }
      card.style.transition = scr.style.transition = scrim.style.transition = 'none';
    }
    if (e.cancelable) e.preventDefault();
    suppressClick = true;
    if (g.mode === 'down') {
      const raw = g.cardY + dy;
      const y2 = raw >= 0 ? raw : rubber(raw, g.h / 4);        // nach oben: gummiartiger Widerstand
      card.style.transform = `translateY(${y2}px)`;
      scrim.style.opacity = String(1 - clamp(y2 / g.h, 0, 1));
      g.hist.push({ v: y2, t: e.timeStamp || performance.now() });
    } else {
      const x2 = Math.max(0, g.scrX + dx);
      scr.style.transform = `translateX(${x2}px)`;
      scr.style.opacity = String(1 - clamp(x2 / g.w, 0, 1) * 0.6);
      g.hist.push({ v: x2, t: e.timeStamp || performance.now() });
    }
    if (g.hist.length > 12) g.hist.shift();
  }

  function end() {
    if (!g) return;
    const mode = g.mode, hist = g.hist;
    if (mode === 'pending') { g = null; return; }
    // Gegriffen, aber nicht bewegt: von der aktuellen Position aus normal weiterlaufen lassen
    if (!hist.length) hist.push({ v: mode === 'down' ? g.cardY : g.scrX, t: performance.now() });
    const v = velocity(), pos = hist[hist.length - 1].v, size = mode === 'down' ? g.h : g.w;
    const commit = pos + project(Math.max(0, v)) > size * 0.4 && v > -0.05;
    g = null;
    const remaining = commit ? size - pos : pos;
    const dur = commit && v > 0.1 ? clamp(4 * remaining / v, 160, 360) : 380;
    const ease = commit && v > 0.1 ? FLING : SNAP;
    if (mode === 'down') {
      card.style.transition = `transform ${dur}ms ${ease}`;
      scrim.style.transition = `opacity ${dur}ms ${ease}`;
      card.style.transform = `translateY(${commit ? size : 0}px)`;
      scrim.style.opacity = commit ? '0' : '1';
      timer = setTimeout(() => {
        if (commit) { card.style.transition = 'none'; closeSheet(); requestAnimationFrame(reset); }
        else reset();
      }, dur);
    } else {
      scr.style.transition = `transform ${dur}ms ${ease}, opacity ${dur}ms ${ease}`;
      scr.style.transform = `translateX(${commit ? size : 0}px)`;
      scr.style.opacity = commit ? '0' : '1';
      timer = setTimeout(() => { reset(); if (commit) pop(); }, dur);
    }
  }

  // Touch (iPhone): passiv starten, beim ersten Bewegen entscheiden und ggf. Scrollen verhindern
  card.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY, e.target); }, { passive: true });
  card.addEventListener('touchmove', e => { if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY, e); else g = null; }, { passive: false });
  card.addEventListener('touchend', end);
  card.addEventListener('touchcancel', end);
  // Maus (Desktop)
  card.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') start(e.clientX, e.clientY, e.target); });
  window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && g) move(e.clientX, e.clientY, e); });
  window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') end(); });
  // Nach einer Wischgeste keinen versehentlichen Tipp auslösen
  card.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  card.addEventListener('touchstart', () => { suppressClick = false; }, { passive: true, capture: true });
  card.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') suppressClick = false; }, true);

  return { reset };
})();

// ── Monat wechseln per Wischen auf der Startseite ────────────────────────────
// Nach links = nächster Monat, nach rechts = voriger. Folgt dem Finger, beim aktuellen Monat
// gibt es nach links nur Gummiband-Widerstand. Die Pfeile ‹ › nutzen dieselbe Richtung.
const monthSwipe = (() => {
  const body = $('#h-body');
  let g = null, timer = null;
  const settle = () => { clearTimeout(timer); body.style.transition = ''; body.style.transform = ''; body.style.opacity = ''; };

  // Neuer Monat gleitet von der Seite herein, aus der er kommt
  function enter(dir, from = 40) {
    if (reduceMotion.matches) { body.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 200 }); return; }
    body.style.transition = 'none';
    body.style.transform = `translateX(${dir * from}px)`;
    body.style.opacity = '0';
    void body.offsetWidth;
    body.style.transition = `transform 320ms ${SNAP}, opacity 220ms ease-out`;
    body.style.transform = 'translateX(0)';
    body.style.opacity = '1';
    timer = setTimeout(settle, 340);
  }

  body.addEventListener('touchstart', e => {
    if (sheet.stack.length || e.touches.length !== 1) return;
    settle();
    const t = e.touches[0];
    g = { x0: t.clientX, y0: t.clientY, mode: 'pending', hist: [], w: body.offsetWidth };
  }, { passive: true });

  body.addEventListener('touchmove', e => {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x0, dy = t.clientY - g.y0;
    if (g.mode === 'pending') {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.2) { g.mode = 'h'; body.style.transition = 'none'; }
      else { g = null; return; }   // senkrecht → normal scrollen
    }
    if (e.cancelable) e.preventDefault();
    const canNext = state.month < currentYM();
    const x = dx < 0 && !canNext ? rubber(dx, g.w / 3) : dx;
    body.style.transform = `translateX(${x}px)`;
    body.style.opacity = String(1 - Math.min(1, Math.abs(x) / g.w) * 0.5);
    g.hist.push({ v: x, t: e.timeStamp || performance.now() });
    if (g.hist.length > 12) g.hist.shift();
  }, { passive: false });

  const end = () => {
    if (!g || g.mode !== 'h' || !g.hist.length) { g = null; return; }
    const h = g.hist, last = h[h.length - 1];
    let i = h.length - 1;
    while (i > 0 && last.t - h[i - 1].t < 80) i--;
    const v = last.t > h[i].t ? (last.v - h[i].v) / (last.t - h[i].t) : 0;
    const x = last.v, w = g.w, projected = x + project(v);
    const canNext = state.month < currentYM();
    const dir = projected < -w * 0.3 && v <= 0.05 && canNext ? 1 : projected > w * 0.3 && v >= -0.05 ? -1 : 0;
    g = null;
    if (!dir) {   // zurückfedern
      body.style.transition = `transform 360ms ${SNAP}, opacity 360ms ${SNAP}`;
      body.style.transform = 'translateX(0)';
      body.style.opacity = '1';
      timer = setTimeout(settle, 380);
      return;
    }
    // Rauswerfen mit der Fingergeschwindigkeit, dann kommt der neue Monat von der anderen Seite
    const remaining = w - Math.abs(x), speed = Math.abs(v);
    const dur = speed > 0.1 ? clamp(4 * remaining / speed, 120, 260) : 240;
    body.style.transition = `transform ${dur}ms ${speed > 0.1 ? FLING : SNAP}, opacity ${dur}ms ease-in`;
    body.style.transform = `translateX(${-dir * w}px)`;
    body.style.opacity = '0';
    timer = setTimeout(() => {
      state.month = shiftMonth(state.month, dir);
      state.intro = 'all';
      render();
      enter(dir, w * 0.35);
    }, dur);
  };
  body.addEventListener('touchend', end);
  body.addEventListener('touchcancel', end);

  return { enter };
})();

// ── Nach dem Speichern: zeigen, was sich verändert hat ───────────────────────
// Die Kilometer zählen vom alten zum neuen Wert hoch, die neue Fahrt gleitet in die Liste.
function countUp(el, from, to, delay = 0) {
  const t0 = performance.now() + delay, dur = 650;
  const paint = v => { el.innerHTML = `${fmtKm(v)} <small>km</small>`; };
  paint(from);
  const step = now => {
    const p = clamp((now - t0) / dur, 0, 1), e = 1 - (1 - p) ** 3;
    paint(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function afterSave(trip) {
  const ym = trip ? trip.date.slice(0, 7) : state.month;
  const before = monthStats(ym).total;
  state.month = ym;                       // dahin springen, wo die Fahrt gelandet ist
  state.intro = 'chart';                  // Linie neu zeichnen; die neue Zeile bekommt eine eigene Animation
  await load();
  if (!trip || reduceMotion.matches) return;
  const after = monthStats(ym).total;
  if (Math.round(after) !== Math.round(before)) countUp($('#h-km'), before, after, 220);
  $(`#h-list [data-trip="${trip.id}"]`)?.animate(
    [{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'none' }],
    { duration: 420, delay: 220, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'backwards' });
}

// iOS zeigt :active (Druck-Feedback) nur, wenn es einen Touch-Listener gibt
document.addEventListener('touchstart', () => {}, { passive: true });

// Haptik: iOS 18+ löst beim Umschalten eines versteckten Switches ein Tippen aus, sonst Vibration API.
// Nur für echte Abschlüsse (Fahrt gestartet / gespeichert), nicht für jeden Tastendruck.
function haptic() {
  if (navigator.vibrate) { navigator.vibrate(10); return; }
  const label = document.createElement('label');
  label.innerHTML = '<input type="checkbox" switch style="display:none">';
  label.style.display = 'none';
  document.head.appendChild(label);
  label.click();
  label.remove();
}

// ── Ziffernblock ─────────────────────────────────────────────────────────────
// value: eingetippte Zeichen. fresh: vorbelegter Wert, wird beim ersten Tippen ersetzt.
function mountKeypad(el, opts) {
  const kp = { value: opts.value || '', fresh: !!opts.fresh, decimal: !!opts.decimal, max: opts.max || 7, onChange: opts.onChange };
  const wrap = document.createElement('div');
  wrap.className = 'keypad';
  const keys = ['1','2','3','4','5','6','7','8','9', kp.decimal ? ',' : '', '0', 'bksp'];
  wrap.innerHTML = keys.map(k => k ? `<button class="key" data-k="${k}">${k === 'bksp' ? icon('bksp') : k}</button>` : '<span></span>').join('');
  wrap.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) press(kp, b.dataset.k); });
  el.appendChild(wrap);
  sheet.keypad = kp;
  return kp;
}
// Löschen nimmt immer nur das letzte Zeichen weg – auch beim vorbelegten Wert,
// damit man z. B. vom letzten Stand nur die letzten Ziffern korrigieren kann.
function press(kp, k) {
  const wasFresh = kp.fresh;
  let v = kp.fresh ? '' : kp.value;
  if (k === 'bksp') { if (!kp.value) return; v = kp.value.slice(0, -1); }
  else if (k === ',') { if (!kp.decimal || v.includes(',')) return; v = (v || '0') + ','; }
  else {
    if (kp.decimal && v.includes(',') && v.split(',')[1].length >= 2) return;
    if (!kp.decimal && v.replace(/\D/g, '').length >= kp.max) return;
    if (v === '0' && !kp.decimal) v = '';
    v += k;
  }
  const el = $('#d-val');
  const gone = k === 'bksp' ? lastTyped(el) : null;
  const rect = gone && { x: gone.offsetLeft, y: gone.offsetTop, text: gone.textContent };
  kp.fresh = false; kp.value = v;
  kp.onChange(v, k, wasFresh);
  updateFoot();
  if (k === 'bksp') dropDigit(el, rect); else popDigit(el);
}

// Die zuletzt getippte Ziffer ist immer die letzte schwarze (graue sind nur ergänzt, Punkte nur Trenner).
function lastTyped(el) {
  if (!el || el.classList.contains('empty-val')) return null;
  return [...el.querySelectorAll('span:not(.gone)')].reverse().find(sp => sp.textContent !== '.' && !sp.classList.contains('ghost'));
}
// Neu getippte Ziffer rollt wie ein Zählwerk von unten ein, schießt minimal über und rastet ein.
// Der Wert selbst steht schon da – die Animation läuft nur darüber und bremst die Eingabe nicht.
function popDigit(el) {
  if (!el || reduceMotion.matches) return;
  lastTyped(el)?.animate([
    { transform: 'translateY(0.55em) rotateX(-80deg) scale(.8)', opacity: 0, filter: 'blur(2px)' },
    { transform: 'translateY(-0.08em) rotateX(8deg) scale(1.06)', opacity: 1, filter: 'blur(0)', offset: .65 },
    { transform: 'none', opacity: 1 },
  ], { duration: 220, easing: 'cubic-bezier(.23,1,.32,1)' });
  el.animate([{ transform: 'none' }, { transform: 'scale(1.025)' }, { transform: 'none' }],
    { duration: 180, easing: 'ease-out' });
}
// Gelöschte Ziffer: eine Kopie an der alten Stelle rollt nach oben weg und verblasst,
// darunter steht schon der neue Wert (z. B. die graue Platzhalter-Ziffer).
function dropDigit(el, at) {
  if (!el || !at || reduceMotion.matches) return;
  const c = document.createElement('span');
  c.className = 'gone';
  c.textContent = at.text;
  c.style.left = at.x + 'px'; c.style.top = at.y + 'px';
  el.appendChild(c);
  c.animate([
    { transform: 'none', opacity: 1 },
    { transform: 'translateY(-0.5em) rotateX(75deg) scale(.75)', opacity: 0, filter: 'blur(2px)' },
  ], { duration: 200, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).onfinish = () => c.remove();
  // Wird die Stelle dabei grau (Platzhalter), blendet die graue Ziffer sanft von unten ein
  const spans = [...el.querySelectorAll('span:not(.gone)')];
  const now = spans.slice(spans.indexOf(lastTyped(el)) + 1).find(sp => sp.textContent !== '.');
  if (now?.classList.contains('ghost'))
    now.animate([{ opacity: 0, transform: 'translateY(0.3em)' }, { opacity: 1, transform: 'none' }],
      { duration: 200, delay: 60, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'backwards' });
  el.animate([{ transform: 'none' }, { transform: 'translateX(-2px)' }, { transform: 'none' }],
    { duration: 160, easing: 'ease-out' });
}
document.addEventListener('keydown', e => {
  if (!sheet.stack.length) return;
  if (e.key === 'Escape') { pop(); return; }
  if (e.key === 'Enter' && sheet.keypad) { $('#btn-next').click(); return; }
  if (!sheet.keypad || e.metaKey || e.ctrlKey) return;
  if (/^\d$/.test(e.key)) press(sheet.keypad, e.key);
  else if (e.key === 'Backspace') press(sheet.keypad, 'bksp');
  else if (e.key === ',' || e.key === '.') press(sheet.keypad, ',');
});

// Kilometerstand-Vervollständigung: nur die letzten Ziffern tippen.
// Basis 178453, getippt "481" → 178481. Getippt "21" → 178521 (nächster passender Stand ≥ Basis).
function completeOdo(typed, base) {
  if (!typed) return { full: '', ghost: 0 };
  if (!base || typed.length >= base.length) return { full: typed, ghost: 0 };
  const n = typed.length;
  const prefix = base.slice(0, base.length - n);
  let cand = Number(prefix + typed);
  if (cand < Number(base)) cand += 10 ** n;
  const full = String(cand);
  return { full, ghost: full.length - n };
}
// Tausenderpunkte einfügen und Ziffern grau färben:
// odoHTML(s, n) → die ersten n Ziffern grau; odoHTML(s, 0, n) → alles ab Position n grau
function odoHTML(full, ghost, blackUpTo = Infinity) {
  if (!full) return '';
  let out = '';
  for (let i = 0; i < full.length; i++) {
    const fromRight = full.length - i;
    const cls = i < ghost || i >= blackUpTo ? 'ghost' : '';
    out += `<span class="${cls}">${full[i]}</span>`;
    if (fromRight > 1 && (fromRight - 1) % 3 === 0) out += `<span class="${cls}">.</span>`;
  }
  return out;
}

// ═════════════════════════════════════════════════════════════════════════════
// Fahrt erfassen
//   Hauptweg:  Fahrt starten (KM-Beginn → Ziel) … später Fahrt beenden (KM-Ende)
//   Nebenweg:  Fahrt nachtragen (alles auf einmal) und Fahrt bearbeiten
// ═════════════════════════════════════════════════════════════════════════════
// draft.mode: 'open' (Fahrt starten), 'open-edit' (laufende Fahrt), 'new' (nachtragen), 'edit'
let draft = null;

const LABELS = { open: 'Fahrt starten', 'open-edit': 'Unterwegs', new: 'Fahrt nachtragen', edit: 'Fahrt bearbeiten' };

function draftKm(d = draft) {
  if (d.start && d.end) return Number(d.end) - Number(d.start);
  return Number(d.km) || 0;
}

async function startTrip() {
  await booted;
  draft = { mode: 'open', date: todayIso(), purpose: '', start: lastOdo(), end: '' };
  openSheet(screenStart(false));
}
function newDraft() {
  draft = { mode: 'new', id: null, date: todayIso(), purpose: '', start: '', end: '', km: 0 };
}
function setEditDraft(t) {
  draft = { mode: 'edit', id: t.id, date: t.date, purpose: t.purpose, start: t.km_start ? String(t.km_start) : '', end: t.km_end ? String(t.km_end) : '', km: t.km };
}
function startEdit(t) {
  setEditDraft(t);
  openSheet(screenSummary());
}
function draftFromOpen() {
  const o = state.open;
  draft = { mode: 'open-edit', date: o.date, purpose: o.purpose, start: String(o.km_start), end: '' };
}
// Hauptknopf unten rechts während der Fahrt: direkt zum Endstand
function finishTrip() {
  draftFromOpen();
  openSheet(screenEnd(false, true));
}
function openTripDetails() {
  draftFromOpen();
  openSheet(screenOpen());
}

async function saveOpen() {
  state.open = await api('PUT', '/open', { date: draft.date, purpose: draft.purpose.trim(), km_start: draft.start });
}
// Änderungen an einer laufenden Fahrt sofort speichern
async function afterEdit() {
  if (draft.mode === 'open-edit') { try { await saveOpen(); } catch { return false; } render(); }
  return true;
}

// Nachtragen, Schritt 1: Wann? Heute / Gestern / Vorgestern mit einem Tipp, sonst Kalender
function screenDate() {
  const day = n => { const d = new Date(); d.setDate(d.getDate() - n); return isoOf(d); };
  const pick = iso => { draft.date = iso; draft.start = lastOdo(null, iso); push(screenStart(false)); };
  return {
    label: LABELS.new,
    title: 'Wann war die Fahrt?',
    mount(el) {
      const longDate = iso => parseIso(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
      el.insertAdjacentHTML('beforeend', `
        <div class="summary">
          ${[['Heute', 0], ['Gestern', 1], ['Vorgestern', 2]].map(([t, n]) => `
            <button class="row" data-day="${day(n)}">
              <span class="main"><div class="t">${t}</div><div class="s">${longDate(day(n))}</div></span>${chev()}
            </button>`).join('')}
          <label class="row" style="position:relative">
            <span class="main"><div class="t">Anderes Datum</div><div class="s">Aus dem Kalender wählen</div></span>${chev()}
            <input type="date" id="other-date" max="${todayIso()}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;-webkit-appearance:none;appearance:none">
          </label>
        </div>`);
      el.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => pick(b.dataset.day)));
      const inp = $('#other-date');
      inp.addEventListener('click', () => { try { inp.showPicker(); } catch {} });
      inp.addEventListener('change', () => { if (inp.value) pick(inp.value); });
    },
  };
}

// KM-Stand Beginn: mit dem letzten Endstand vorbelegt → meist nur „Weiter“
function screenStart(fromSummary) {
  const base = draft.mode === 'open' ? lastOdo() : draft.mode === 'new' ? lastOdo(null, draft.date) : '';
  const compBase = base || draft.start;
  let full = draft.start, ghost = 0;
  // Korrigieren: Löschen am vorbelegten Stand nimmt hinten Ziffern weg, der Rest bleibt stehen.
  // Neue Ziffern füllen dann die Lücke von vorne auf (statt als „letzte Ziffern“ ergänzt zu werden).
  let typed = '', fixing = false;
  return {
    label: LABELS[draft.mode],
    title: 'KM-Stand Beginn',
    mount(el) {
      el.insertAdjacentHTML('beforeend', `<div class="display"><div class="val num" id="d-val"></div><div class="hint" id="d-hint"></div></div>`);
      const paint = () => {
        const v = $('#d-val'), h = $('#d-hint');
        h.className = 'hint';
        if (fixing && !full) {
          v.className = 'val num';
          v.innerHTML = odoHTML(typed + compBase.slice(typed.length), 0, typed.length);
          const missing = compBase.length - typed.length;
          h.textContent = missing === 1 ? 'Noch eine Ziffer' : `Noch ${missing} Ziffern`;
          return;
        }
        v.className = 'val num' + (full ? '' : ' empty-val');
        v.innerHTML = full ? odoHTML(full, ghost) : '0';
        if (!base || !full) h.textContent = base ? `Letzter Stand ${fmtOdo(base)}` : 'Kilometerstand eintippen';
        else if (full === base) h.textContent = 'Wie Ende der letzten Fahrt';
        else if (Number(full) > Number(base)) h.textContent = `${fmtKm(full - base)} km seit deiner letzten Fahrt`;
        else { h.textContent = `Kleiner als letzter Stand ${fmtOdo(base)}`; h.className = 'hint warn'; }
      };
      mountKeypad(el, {
        value: full, fresh: true, max: 7,
        onChange(v, k, wasFresh) {
          typed = v;
          if (k === 'bksp' && wasFresh && compBase) fixing = true;
          if (!v) fixing = false;
          if (fixing) { full = v.length >= compBase.length ? v : ''; ghost = 0; }
          else ({ full, ghost } = completeOdo(v, compBase));
          paint();
        },
      });
      paint();
    },
    next: {
      enabled: () => !!full && Number(full) > 0,
      async run() {
        draft.start = full;
        if (fromSummary) { if (await afterEdit()) pop(); return; }
        push(draft.mode === 'open' ? screenPurpose(false) : screenEnd(false));
      },
    },
  };
}

// KM-Stand Ende: alles bis auf die letzten zwei Ziffern steht schon da (Fahrten < 100 km).
// Für längere Fahrten einfach mit ← weiter zurück löschen.
function screenEnd(fromSummary, finish) {
  const start = draft.start;
  const ref = draft.end || start;                  // liefert die grauen Platzhalter-Ziffern
  const prefix = start.length > 2 ? start.slice(0, -2) : '';
  let v = draft.end ? draft.end.slice(0, -2) : prefix;

  const calc = () => {
    if (!start) return v ? Number(v) : null;
    if (v.length < start.length) return null;
    let n = Number(v);
    // Nur die letzten zwei getippt, aber kleiner als Beginn → über einen Hunderter gefahren
    if (n <= Number(start) && v.length === start.length && v.startsWith(prefix)) n += 100;
    return n;
  };

  return {
    label: finish ? draft.purpose : LABELS[draft.mode],
    title: 'KM-Stand Ende',
    mount(el) {
      el.insertAdjacentHTML('beforeend', `<div class="display"><div class="val num" id="d-val"></div><div class="hint" id="d-hint"></div></div>`);
      const paint = () => {
        const d = $('#d-val'), h = $('#d-hint');
        const full = calc();
        d.className = 'val num';
        h.className = 'hint';
        if (full === null) {
          const tail = ref.slice(v.length);
          d.innerHTML = v || tail ? odoHTML(v + tail, 0, v.length) : '<span class="ghost">0</span>';
          const missing = start.length - v.length;
          h.textContent = !start ? 'Kilometerstand eintippen'
            : missing === 2 ? 'Letzte zwei Ziffern eintippen'
            : missing === 1 ? 'Noch eine Ziffer'
            : `Noch ${missing} Ziffern`;
        } else {
          d.innerHTML = odoHTML(String(full), 0);
          const km = start ? full - Number(start) : 0;
          if (!start) h.textContent = '';
          else if (km > 0) { h.className = 'hint ok'; h.textContent = `= ${fmtKm(km)} km gefahren`; }
          else { h.className = 'hint warn'; h.textContent = 'Muss größer als der Beginn sein'; }
        }
      };
      mountKeypad(el, { value: v, fresh: false, max: 7, onChange(x) { v = x; paint(); } });
      paint();
    },
    next: {
      label: finish ? 'Speichern' : 'Weiter',
      icon: finish ? 'check' : 'next',
      enabled: () => { const f = calc(); return f !== null && f > 0 && (!start || f > Number(start)); },
      async run() {
        draft.end = String(calc());
        draft.km = draftKm();
        if (finish) return finishOpen();
        if (fromSummary) return pop();
        push(screenPurpose(false));
      },
    },
  };
}

async function finishOpen() {
  haptic();
  const btn = $('#btn-next'); btn.disabled = true;
  let trip;
  try { trip = await api('POST', '/open/finish', { km_end: draft.end }); }
  catch { btn.disabled = false; return; }
  closeSheet();
  toast(`${fmtKm(trip.km)} km · ${trip.purpose}`);
  await afterSave(trip);
}

// Ziel / Zweck – häufige Ziele mit einem Tipp
function screenPurpose(fromSummary) {
  let val = draft.purpose;
  const starting = draft.mode === 'open' && !fromSummary;
  const done = async () => {
    draft.purpose = val.trim();
    if (fromSummary) { if (await afterEdit()) pop(); return; }
    if (starting) {
      haptic();
      try { await saveOpen(); } catch { return; }
      closeSheet();
      await load();
      toast(`Gute Fahrt · ${draft.purpose}`);
      return;
    }
    push(screenSummary());
  };
  return {
    label: draft.mode === 'new' || draft.mode === 'edit' ? `${fmtKm(draftKm())} km` : LABELS[draft.mode],
    title: draft.mode === 'open' || draft.mode === 'open-edit' ? 'Wohin geht’s?' : 'Wofür war die Fahrt?',
    mount(el) {
      el.insertAdjacentHTML('beforeend', `
        <input class="text-in" id="p-in" type="text" placeholder="Ziel oder Zweck" autocomplete="off" autocapitalize="sentences" enterkeyhint="${starting ? 'go' : 'next'}" value="${esc(val)}">
        <div class="suggest" id="p-sug"></div>`);
      const inp = $('#p-in');
      let touched = false;   // vorhandenen Wert nicht als Filter nehmen, erst beim Tippen filtern
      const paint = () => {
        $('#p-sug').innerHTML = purposeSuggestions(touched ? val : '').map(p => `
          <button class="row" data-pick="${esc(p)}">
            <span class="main"><div class="t">${esc(p)}</div></span>
            ${chev()}
          </button>`).join('');
      };
      inp.addEventListener('input', () => { val = inp.value; touched = true; paint(); updateFoot(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && val.trim()) { e.preventDefault(); done(); } });
      $('#p-sug').addEventListener('click', e => {
        const b = e.target.closest('[data-pick]');
        if (b) { val = b.dataset.pick; done(); }
      });
      paint();
      // Tastatur nur sofort öffnen, wenn es keine Vorschläge gibt oder ein Wert geändert wird
      if (fromSummary || !purposeSuggestions('').length) setTimeout(() => inp.focus(), 350);
    },
    next: { label: starting ? 'Losfahren' : 'Weiter', enabled: () => !!val.trim(), run: done },
  };
}

// Laufende Fahrt: Details, ändern, verwerfen oder beenden
function screenOpen() {
  let confirmDel = false;
  return {
    label: 'Unterwegs',
    title: () => draft.purpose,
    mount(el) {
      const since = new Date(String(state.open.started_at).replace(' ', 'T') + 'Z');
      const time = isNaN(since) ? '' : since.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      el.insertAdjacentHTML('beforeend', `
        <div class="summary">
          <div class="sum-row"><span class="k">Gestartet</span><span class="v">${relDate(draft.date)}${time ? ', ' + time : ''}</span></div>

function recipientsScreen() {

      el.insertAdjacentHTML('beforeend', `

      const box = $('#rcpts');
      const row = (val, i) => `
        <div class="rcpt">
          <input class="text-in" data-i="${i}" type="text" inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off"

          ${list.length > 1 || val ? `<button class="rm" data-rm="${i}" aria-label="Adresse entfernen">${icon('close')}</button>` : ''}
        </div>`;
      const paint = () => { box.innerHTML = list.map(row).join(''); };
      const fresh = el => { if (!reduceMotion.matches) el?.animate([{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.23,1,.32,1)' }); };
      box.addEventListener('input', e => {
        const i = Number(e.target.dataset.i);

        if (!hadRm !== !(list.length > 1 || list[i])) { const pos = e.target.selectionStart; paint(); const inp = box.querySelector(`[data-i="${i}"]`); inp.focus(); inp.setSelectionRange(pos, pos); }

// ── App-Update ───────────────────────────────────────────────────────────────
// Prüft GitHub auf neue Versionen, spielt sie auf dem Server ein und lädt die App danach neu.
const fmtShortDate = iso => iso ? new Date(iso).toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

function updateScreen() {
  let info = null, phase = 'checking', error = '';   // checking | ready | updating | restarting | error
  const paint = () => {
    const el = $('#u-body');
    if (!el) return;
    const v = info || state.version || {};
    const rows = [`<div class="sum-row"><span class="k">Installiert</span><span class="v num">${esc(v.commit || '—')} · ${fmtShortDate(v.date)}</span></div>`];
    let text = '';
    if (phase === 'checking') text = 'Suche nach Updates …';
    else if (phase === 'error') text = `<b>Das hat nicht geklappt.</b><br>${esc(error)}`;
    else if (phase === 'updating') text = '<b>Wird aktualisiert …</b><br>Datenbank wird gesichert, neue Version wird geladen. Das dauert meist ein paar Sekunden.';
    else if (phase === 'restarting') text = '<b>Startet neu …</b><br>Die App lädt sich gleich von selbst neu.';
    else if (!info.commits.length) text = 'Du hast die neueste Version.';
    else {
      text = `<b>${info.commits.length === 1 ? 'Eine neue Änderung' : `${info.commits.length} neue Änderungen`}</b>`;
      rows.push(...info.commits.slice(0, 8).map(c => `<div class="sum-row"><span class="k">${esc(c.commit)}</span><span class="v">${esc(c.subject)}</span></div>`));
    }
    if (info && !info.supervised && phase === 'ready' && info.commits.length) text += '<br><br>Die App läuft nicht als systemd-Dienst – nach dem Update bitte von Hand neu starten.';
    el.innerHTML = rows.join('') + `<p class="fine">${text}</p>`;
    updateFoot();
  };

  async function check() {
    phase = 'checking'; paint();
    try { info = await api('GET', '/update'); phase = 'ready'; }
    catch (e) { phase = 'error'; error = e.message; }
    paint();
  }

  // Nach dem Neustart: warten, bis der Server mit der neuen Version antwortet
  async function waitForRestart(to) {
    const until = Date.now() + 90 * 1000;
    while (Date.now() < until) {
      await new Promise(r => setTimeout(r, 1000));
      try {
        const v = await (await fetch('/api/version', { cache: 'no-store' })).json();
        if (v.commit === to) { haptic(); location.reload(); return; }
      } catch { /* Server startet noch */ }
    }
    phase = 'error'; error = 'Der Server ist nach dem Update nicht wieder hochgekommen. Bitte in Proxmox nachsehen (journalctl -u fahrtenbuch).';
    paint();
  }

  async function run() {
    phase = 'updating'; paint();
    let r;
    try { r = await api('POST', '/update', {}); }
    catch (e) { phase = 'error'; error = e.message; paint(); return; }
    if (!r.updated) { toast('Schon auf dem neuesten Stand'); return check(); }
    if (!r.restarting) { phase = 'error'; error = `Version ${r.to} ist geladen. Bitte die App auf dem Server neu starten (systemctl restart fahrtenbuch).`; paint(); return; }
    phase = 'restarting'; paint();
    waitForRestart(r.to);
  }

  return {
    label: 'Einstellungen', title: 'App-Update',
    mount(el) {
      el.insertAdjacentHTML('beforeend', '<div class="summary" id="u-body"></div>');
      if (!info && phase === 'checking') check(); else paint();
    },
    next: {
      label: () => phase === 'updating' ? 'Wird aktualisiert …' : phase === 'restarting' ? 'Startet neu …' : phase === 'error' ? 'Erneut prüfen' : 'Jetzt aktualisieren',
      icon: 'download',
      enabled: () => phase === 'error' || (phase === 'ready' && info.commits.length > 0),
      run: () => phase === 'error' ? check() : run(),
    },
  };
}

$('#file-in').addEventListener('change', async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  let added = 0, skipped = 0, failed = 0;
  for (const f of files) {
    try {
      const r = await api('POST', '/import', await f.text(), true);
      added += r.added; skipped += r.skipped;
    } catch { failed++; }
  }
  await load();
  if (sheet.stack.length) showScreen(null);
  if (added || skipped) toast(`${added} Fahrten importiert` + (skipped ? ` · ${skipped} schon da` : ''));
});

function csvString(rows) {
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\r\n');
}
function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob(['﻿' + content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

// Gleiches Format wie die alte Version → kompatibel mit bisherigen Dateien
function exportCSV(ym) {
  const { trips, total, extra, cost } = monthStats(ym);
  const s = state.settings;
  const rows = [
    ['Datum', 'Zweck der Fahrt', 'KM-Stand Beginn', 'KM-Stand Ende', 'Kilometer'],
    ...trips.map(t => [fmtDateDE(t.date), t.purpose, t.km_start || '', t.km_end || '', t.km]),
    [],
    ['', '', '', 'Gesamt KM:', total],
    ['', '', '', 'Freikilometer:', s.freeKm],
    ['', '', '', 'Mehrkilometer:', extra],
    ['', '', '', 'Preis/km (EUR):', s.pricePerKm.toFixed(2)],
    ['', '', '', 'Zu zahlen (EUR):', cost.toFixed(2)],
  ];
  download(`Fahrtenbuch_${ym}.csv`, csvString(rows), 'text/csv;charset=utf-8');
  toast('CSV exportiert');
}

function exportBackup() {
  const rows = [
    ['Datum', 'Zweck der Fahrt', 'KM-Stand Beginn', 'KM-Stand Ende', 'Kilometer'],
    ...state.trips.map(t => [fmtDateDE(t.date), t.purpose, t.km_start || '', t.km_end || '', t.km]),
  ];
  download(`Fahrtenbuch_Sicherung_${todayIso()}.csv`, csvString(rows), 'text/csv;charset=utf-8');
  toast(`${state.trips.length} Fahrten gesichert`);
}

// Die PDF erzeugt der Server – dieselbe Datei, die auch per E-Mail verschickt wird
async function exportPDF(ym) {
  let blob;
  try {
    const res = await fetch(`/api/report/${ym}.pdf`);
    if (!res.ok) throw new Error();
    blob = await res.blob();
  } catch { toast('PDF konnte nicht erstellt werden', true); return; }
  const name = `Fahrtenbuch_${ym}.pdf`;
  // Auf dem iPhone: Teilen-Menü (Speichern in Dateien, AirDrop, Mail …)
  const file = new File([blob], name, { type: 'application/pdf' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  download(name, blob);
  toast('PDF exportiert');
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, isError = false) {
  const el = $('#toast');
  el.querySelector('.ti').innerHTML = icon(isError ? 'alert' : 'check');
  el.querySelector('span:last-child').textContent = msg;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

// ── Start ────────────────────────────────────────────────────────────────────
hydrateIcons();

const booted = load().catch(() => {});

document.addEventListener('visibilitychange', () => { if (!document.hidden && !sheet.stack.length) load(); });
